<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ghost Electronics</title>
<!-- Ghost Electronics' own page (tools/admin/README.md): the production log, garages, licences, credits and
     Pros on Supabase. The page is public; what it shows comes only to a signed-in admin, and the database
     enforces that (migrations/20261014150000_admin_page.sql), not this page. -->
<style>
@font-face { font-family: "Orbitron"; src: url("Orbitron.ttf") format("truetype"); font-weight: 400 900; font-display: swap; }
:root {
  --bg: #0A0B0D; --panel: #121418; --panel2: #171a1f; --line: #23272E; --line2: #2f343c;
  --ink: #EDEFF2; --dim: #8A9099; --gold: #FFC20E; --ok: #35D07F; --bad: #FF5A4E; --warn: #FFA23A; --cool: #5AB8FF;
  --readout: "Orbitron", ui-monospace, SFMono-Regular, Menlo, monospace;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gold); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }

/* sign in */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate form { width: min(380px, 100%); display: grid; gap: 14px; }
.brand { font: 700 15px/1 var(--readout); letter-spacing: 6px; text-align: center; margin: 0 0 6px; }
.brand small { display: block; font: 600 10px/1 var(--readout); letter-spacing: 4px; color: var(--dim); margin-top: 10px; }
label { display: grid; gap: 6px; color: var(--dim); font-size: 12.5px; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; min-width: 0; color: var(--ink); }
input::placeholder, textarea::placeholder { color: #5b616a; }
textarea { resize: vertical; min-height: 64px; }
input.code { font: 700 26px/1 var(--readout); letter-spacing: 10px; text-align: center; }
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--dim); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #111; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.msg { min-height: 20px; color: var(--dim); font-size: 13px; margin: 0; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }

/* the page */
header.top { position: sticky; top: 0; z-index: 5; background: rgba(10,11,13,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1200px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar .brand { text-align: start; margin: 0; font-size: 13px; letter-spacing: 5px; }
.bar .who { margin-inline-start: auto; color: var(--dim); font-size: 12.5px; display: flex; gap: 10px; align-items: center; }
nav.tabs { max-width: 1200px; margin: 0 auto; padding: 8px 12px 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { color: var(--dim); text-decoration: none; padding: 9px 12px 11px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--gold); }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 18px; }
h1 { font: 700 18px/1.2 var(--readout); letter-spacing: 2px; margin: 4px 0 0; }
h2 { font: 700 11px/1 var(--readout); letter-spacing: 2.5px; color: var(--dim); margin: 0 0 12px; text-transform: uppercase; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
.tile b { font: 800 30px/1.1 var(--readout); }
.tile span { color: var(--dim); font-size: 12.5px; }
.tile i { font-style: normal; color: var(--dim); font-size: 12px; }
.two { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input[type=search] { flex: 1 1 220px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--dim); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 11.5px; letter-spacing: .4px; position: sticky; top: 0; background: var(--panel); }
tr:last-child td { border-bottom: 0; }
tbody tr.go { cursor: pointer; }
tbody tr.go:hover td { background: var(--panel2); }
td.wrap { white-space: normal; min-width: 200px; }
.ser { font: 700 12.5px/1 var(--readout); letter-spacing: 1px; color: var(--gold); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.dim { color: var(--dim); }
.badge { display: inline-block; font: 700 10.5px/1 var(--readout); letter-spacing: 1px; padding: 4px 7px; border-radius: 6px; border: 1px solid currentColor; }
.badge.PASS, .badge.active { color: var(--ok); } .badge.FAIL, .badge.cancelled, .badge.ran { color: var(--bad); }
.badge.allocated, .badge.soon { color: var(--warn); } .badge.demo { color: var(--gold); }
.plus { color: var(--ok); } .minus { color: var(--bad); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.kv dt { color: var(--dim); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); align-items: end; }
.form .full { grid-column: 1 / -1; }
ol.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
ol.timeline li { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
ol.timeline li:last-child { border-bottom: 0; }
ol.timeline time { color: var(--dim); font-size: 12.5px; }
ol.timeline .what { overflow-wrap: anywhere; }
ol.timeline .what b { font-weight: 600; }
.back { color: var(--dim); text-decoration: none; font-size: 13px; }
.count { display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 9px; background: var(--gold); color: #111; font-size: 11px; font-weight: 700; text-align: center; }
.badge.revoked { color: var(--bad); }
.req { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.req:last-child { border-bottom: 0; }
.req .tools { gap: 6px; }
.empty { color: var(--dim); padding: 18px; text-align: center; }
.toast { position: fixed; inset-inline: 0; bottom: 18px; margin: 0 auto; width: max-content; max-width: calc(100vw - 32px); background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.bad { border-color: var(--bad); }
@media (max-width: 560px) { ol.timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; } .tile b { font-size: 24px; } }

/* the board: workstreams by stage, their steps as rev blocks */
.kanban { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(210px, 1fr)); overflow-x: auto; align-items: start; padding-bottom: 4px; }
@media (max-width: 900px) { .kanban { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 8px; align-content: start; min-height: 90px; border-radius: 14px; padding: 2px; }
.col.over { background: var(--panel2); outline: 1px dashed var(--dim); }
.col > header { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 6px 8px; border-bottom: 1px solid var(--line); }
.col > header b { font: 700 11px/1 var(--readout); letter-spacing: 2px; text-transform: uppercase; }
.card { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: inherit; text-decoration: none; cursor: grab; min-width: 0; }
.card:hover { border-color: var(--line2); }
.card .t { font-weight: 600; line-height: 1.3; }
.card .m { color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.card .n { color: var(--dim); font-size: 12.5px; line-height: 1.4; }
.card .n b { color: var(--ink); font-weight: 600; }
.card .w { font-size: 12.5px; line-height: 1.4; color: var(--warn); }
.blocks { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; vertical-align: middle; }
.blocks i { width: 9px; height: 7px; border-radius: 2px; background: var(--line2); }
.blocks i.Done { background: var(--ok); } .blocks i.Doing { background: var(--ink); } .blocks i.Blocked { background: var(--bad); }
.stage { display: inline-block; font: 700 10px/1 var(--readout); letter-spacing: 1px; padding: 4px 7px; border-radius: 6px; border: 1px solid currentColor; text-transform: uppercase; white-space: nowrap; }
.stage.Idea { color: var(--dim); } .stage.Designed { color: var(--cool); } .stage.Building { color: var(--gold); } .stage.Testing { color: var(--warn); } .stage.Done { color: var(--ok); }
.by { font-size: 11.5px; color: var(--dim); overflow-wrap: anywhere; }
.by b, .you { color: var(--gold); font-weight: 600; }
ol.steps { list-style: none; margin: 0; padding: 0; }
ol.steps li { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
ol.steps li:last-child { border-bottom: 0; }
ol.steps .f { display: grid; gap: 6px; min-width: 0; }
ol.steps .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
ol.steps select, ol.steps input, .tablewrap select { padding: 6px 8px; border-radius: 8px; font-size: 13px; }
ol.steps li.Done input.txt { color: var(--dim); }
ol.steps li.Blocked > select { border-color: var(--bad); } ol.steps li.Doing > select { border-color: var(--ink); } ol.steps li.Done > select { border-color: var(--ok); }
.check { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12.5px; }
.check input { width: auto; }
@media (max-width: 560px) { ol.steps li { grid-template-columns: minmax(0, 1fr) auto; } ol.steps li > select { grid-column: 1 / -1; } }

/* the calendar: Sunday first, as the week runs in Qatar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { color: var(--dim); font: 600 10.5px/1 var(--readout); letter-spacing: 1px; text-align: center; padding: 6px 0; }
.cal button.d { min-height: 96px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: start; display: grid; align-content: start; gap: 3px; cursor: pointer; min-width: 0; overflow: hidden; }
.cal button.d.out { opacity: .4; }
.cal button.d.today { border-color: var(--gold); }
.cal button.d.sel { background: var(--panel2); border-color: var(--ink); }
.cal .num { font: 700 12px/1 var(--readout); }
.cal .e { font-size: 11px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-inline-start: 3px solid var(--line2); padding-inline-start: 4px; }
.cal .e.note { border-color: var(--gold); } .cal .e.release { border-color: var(--cool); } .cal .e.done { border-color: var(--ok); } .cal .e.due { border-color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; background: var(--line2); }
.legend .note::before { background: var(--gold); } .legend .release::before { background: var(--cool); } .legend .done::before { background: var(--ok); } .legend .due::before { background: var(--warn); }
ul.day { list-style: none; margin: 0; padding: 0; }
ul.day li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
ul.day li:last-child { border-bottom: 0; }
@media (max-width: 640px) {
  .cal button.d { min-height: 58px; padding: 5px; }
  .cal .e { font-size: 0; height: 4px; padding: 0; border: 0; border-radius: 2px; background: var(--line2); }
  .cal .e.note { background: var(--gold); } .cal .e.release { background: var(--cool); } .cal .e.done { background: var(--ok); } .cal .e.due { background: var(--warn); }
}

/* the inventory, drawn as the canvas "Ghost Inventory" draws it: black, Orbitron labels, 22 px cards */
body.invpage { background: #000; }
body.invpage header.top { background: rgba(0,0,0,.92); }
main.inv { max-width: 1432px; gap: 18px; color: #fff; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
.inv a { color: #3ba9f5; } .inv a:hover { color: #7cc6fa; }
.inv .lbl { font: 600 11px/1.3 Orbitron, ui-monospace, monospace; letter-spacing: 1.6px; color: #7b8488; text-transform: uppercase; }
.inv .num { font-family: Orbitron, ui-monospace, monospace; font-weight: 700; letter-spacing: 1px; }
.inv .mono { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #7b8488; }
.inv .soft { color: #7b8488; } .inv .note { margin: 0; font-size: 13px; color: #7b8488; }
.inv h1.t { margin: 0; font: 700 28px/34px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: 0; overflow-wrap: anywhere; }
.inv .lede { margin: 0; font-size: 15px; color: #7b8488; max-width: 720px; }
.inv .back { text-decoration: none; color: #7b8488 !important; padding: 10px 0; align-self: flex-start; display: inline-block; }
.inv .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.inv .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.inv .c1 { background: #0c0d0f; border: 1px solid #1e2126; border-radius: 22px; }
.inv .c2 { background: #111316; border: 1px solid #1e2126; border-radius: 16px; padding: 14px 16px; }
.inv .tile { background: #111316; border: 1px solid #1e2126; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; color: #fff; text-decoration: none; }
.inv a.tile:hover { border-color: #2a2f36; color: #fff; }
.inv .tile.hero { background: #0c0d0f; border-radius: 22px; padding: 18px; }
.inv .tile small { font-size: 13px; color: #7b8488; }
.inv .tiles4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.inv .tilesS { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.inv .ib { all: unset; box-sizing: border-box; min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #2a2f36; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: #fff !important; text-decoration: none; white-space: nowrap; }
.inv .ib:hover { border-color: #7b8488; }
.inv .ib.gold { background: #ffc20e; border-color: #ffc20e; color: #000 !important; font-weight: 700; padding: 0 18px; }
.inv .ib.big { min-height: 52px; font-size: 16px; width: 100%; }
.inv .ib.sm { min-height: 32px; padding: 0 10px; font-size: 12.5px; border-radius: 10px; }
.inv .ib.on { border-color: #ff4338; color: #ff4338 !important; }
.inv .ib:disabled, .inv .ib[aria-disabled="true"] { opacity: .45; cursor: default; }
.inv .ib:focus-visible, .inv .catbtn:focus-visible, .inv .segb:focus-visible, .inv .step:focus-visible, .inv .chipbtn:focus-visible { outline: 2px solid #3ba9f5; outline-offset: 2px; }
.inv .link { all: unset; color: #3ba9f5; cursor: pointer; font-size: 14px; font-weight: 600; }
.inv .search { flex: 1 1 280px; display: flex; align-items: center; gap: 10px; background: #111316; border: 1px solid #1e2126; border-radius: 14px; padding: 0 14px; min-height: 44px; color: inherit; }
.inv .search:focus-within { border-color: #3ba9f5; }
.inv .search input { all: unset; flex: 1; min-width: 0; font-size: 15px; color: #fff; min-height: 44px; }
.inv .search.lg { min-height: 48px; } .inv .search.lg input { font-size: 16px; min-height: 46px; }
.inv .sr { position: absolute; left: -9999px; }
.inv aside.cats { flex: 1 1 230px; max-width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 10px; }
.inv .catbtn { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 12px; cursor: pointer; font: 500 14px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #c9d0d4; }
.inv .catbtn[aria-pressed="true"] { background: #1e2126; color: #fff; }
.inv .catbtn .num { font-size: 11px; color: #7b8488; }
.inv .tw { overflow-x: auto; }
.inv table { width: 100%; border-collapse: collapse; font-size: 14px; }
.inv th { font: 600 10px/1.2 Orbitron, ui-monospace, monospace; letter-spacing: 1.6px; color: #7b8488; text-align: left; padding: 10px 12px; border-bottom: 1px solid #1e2126; white-space: nowrap; position: static; background: none; text-transform: uppercase; }
.inv td { padding: 12px; border-bottom: 1px solid #15181c; vertical-align: middle; white-space: normal; }
.inv tr:last-child td { border-bottom: 0; }
.inv th.r, .inv td.r { text-align: right; }
.inv tbody tr.go:hover td { background: #111316; }
.inv .pn { font-size: 14px; font-weight: 600; color: #fff; text-decoration: none; }
.inv .mbar { height: 6px; border-radius: 999px; background: #1e2126; overflow: hidden; }
.inv .mbar i { display: block; height: 6px; border-radius: 999px; }
.inv .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.inv .chip { font: 600 10px/1 Orbitron, ui-monospace, monospace; letter-spacing: 1px; color: #c9d0d4; border: 1px solid #2a2f36; border-radius: 999px; padding: 4px 8px; white-space: nowrap; }
.inv .seg { display: flex; gap: 4px; background: #111316; border: 1px solid #1e2126; border-radius: 16px; padding: 4px; flex-wrap: wrap; }
.inv .seg.sm { border-radius: 14px; padding: 2px; }
.inv .segb { all: unset; box-sizing: border-box; min-height: 44px; padding: 0 18px; border-radius: 12px; cursor: pointer; font: 600 14px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #7b8488; text-align: center; }
.inv .seg.sm .segb { flex: 1; min-height: 40px; padding: 0 10px; border-radius: 10px; }
.inv .seg.fill .segb { flex: 1; font-size: 15px; }
.inv .segb[aria-pressed="true"] { background: #1e2126; color: #fff; }
.inv .step { all: unset; box-sizing: border-box; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2a2f36; display: flex; align-items: center; justify-content: center; cursor: pointer; font: 700 20px Orbitron, monospace; color: #fff; flex-shrink: 0; }
.inv .step.xl { width: 64px; height: 64px; border-radius: 16px; font-size: 28px; }
.inv input.bignum { all: unset; box-sizing: border-box; font: 700 60px/1 Orbitron, monospace; letter-spacing: 1px; width: 150px; text-align: center; color: #fff; }
.inv input.midnum { all: unset; box-sizing: border-box; font: 700 38px/1 Orbitron, monospace; letter-spacing: 1px; width: 90px; text-align: center; color: #fff; }
.inv .field { display: flex; flex-direction: column; gap: 6px; color: inherit; font-size: 15px; }
.inv .inp { all: unset; box-sizing: border-box; min-height: 44px; padding: 0 14px; background: #111316; border: 1px solid #1e2126; border-radius: 14px; font-size: 15px; color: #fff; width: 100%; min-width: 0; }
.inv select.inp { appearance: auto; -webkit-appearance: menulist; padding-right: 8px; }
.inv textarea.inp { padding: 10px 14px; min-height: 88px; white-space: pre-wrap; }
.inv .inp:focus { border-color: #3ba9f5; }
.inv .inp::placeholder { color: #5b616a; }
.inv .inp.n { font-family: Orbitron, monospace; font-weight: 700; }
.inv .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.inv .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.inv .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.inv .kv > div { display: flex; flex-direction: column; gap: 4px; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.inv .chipbtn { all: unset; box-sizing: border-box; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font: 600 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #7b8488; border: 1px solid #2a2f36; }
.inv .chipbtn[aria-pressed="true"] { background: #1e2126; color: #fff; border-color: #c9d0d4; }
.inv .chipbtn input { all: unset; width: 34px; font: 700 11px Orbitron, monospace; text-align: center; border-bottom: 1px solid #7b8488; color: #fff; }
.inv details > summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; list-style: none; }
.inv details > summary::-webkit-details-marker { display: none; }
.inv details > summary::before { content: "›"; margin-right: 8px; transition: transform .15s; display: inline-block; }
.inv details[open] > summary::before { transform: rotate(90deg); }
.inv .drop { border: 1px dashed #2a2f36; border-radius: 16px; min-height: 96px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #7b8488; font-size: 14px; cursor: pointer; padding: 10px; text-align: center; }
.inv .drop.over { border-color: #3ba9f5; color: #fff; }
.inv .drop img { max-height: 140px; max-width: 100%; border-radius: 10px; }
.inv .photo { aspect-ratio: 16 / 10; border-radius: 22px; border: 1px dashed #2a2f36; background: #0c0d0f; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; cursor: pointer; overflow: hidden; position: relative; }
.inv .photo.has { border-style: solid; border-color: #1e2126; }
.inv .photo img { width: 100%; height: 100%; object-fit: cover; }
.inv .photo.over { border-color: #3ba9f5; }
.inv .check { display: flex; gap: 10px; align-items: center; min-height: 32px; font-size: 15px; color: #fff; }
.inv .check input { width: 18px; height: 18px; margin: 0; accent-color: #ffc20e; }
.inv .lines > div { display: grid; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #1e2126; font-size: 14px; }
.inv .lines.mv > div { grid-template-columns: 110px minmax(0, 1fr) 70px 70px 120px; }
.inv .lines.od > div { grid-template-columns: 110px minmax(0, 1fr) 80px 110px auto; }
.inv .lines .r { text-align: right; }
.inv .uses > div { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e2126; }
.inv .label { background: #fff; border-radius: 6px; padding: 6px; width: 280px; max-width: 100%; box-sizing: border-box; line-height: 0; }
.inv .label canvas { width: 100%; height: auto; image-rendering: pixelated; }
.inv .labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.inv .hit { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #1e2126; cursor: pointer; width: 100%; }
.inv .hit:hover { background: #111316; }
.inv .hit:last-child { border-bottom: 0; }
.inv .hit.new { background: #111316; font-size: 15px; font-weight: 600; justify-content: flex-start; }
.inv .phone { max-width: 430px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-height: calc(100vh - 160px); }
.inv .qr { width: 64px; height: 64px; border-radius: 10px; background: #fff; flex-shrink: 0; padding: 6px; box-sizing: border-box; line-height: 0; }
.inv .qr canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.inv .lv-crit { color: #ff4338 !important; } .inv .lv-warn { color: #ff9e2c !important; } .inv .lv-ok { color: #35d07f !important; } .inv .lv-cool { color: #3ba9f5 !important; } .inv .lv-off { color: #3a4048 !important; }
.inv .panelform { background: #0c0d0f; border: 1px solid #2a2f36; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.scanner { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; color: #fff; }
.scanner video { width: min(100%, 480px); aspect-ratio: 1; object-fit: cover; border-radius: 22px; border: 2px solid #3ba9f5; background: #0c0d0f; }
.scanner p { margin: 0; font: 600 11px/1.4 Orbitron, monospace; letter-spacing: 1.6px; color: #7b8488; text-transform: uppercase; text-align: center; }
@media (max-width: 700px) {
  .inv aside.cats { flex-direction: row; overflow-x: auto; flex: 1 1 100%; padding: 6px; }
  .inv aside.cats > .lbl { display: none; }
  .inv .catbtn { width: auto; flex-shrink: 0; min-height: 36px; }
  .inv .lines.mv > div { grid-template-columns: 84px minmax(0, 1fr) 56px 56px; }
  .inv .lines.mv > div > :nth-child(5) { display: none; }
  .inv .lines.od > div { grid-template-columns: 90px minmax(0, 1fr) 50px; }
  .inv .lines.od > div > :nth-child(n+4) { grid-column: 2 / -1; }
  .inv h1.t { font-size: 22px; line-height: 28px; }
  .inv input.bignum { font-size: 48px; width: 120px; }
}
</style>
</head>
<body>

<section class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="on">
    <p class="brand">GHOST ELECTRONICS<small>PRODUCTION · GARAGES · CREDITS</small></p>
    <label id="emailField">Email
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </label>
    <label id="codeField" hidden>The 6-digit code we emailed you
      <input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000">
    </label>
    <button class="btn gold" id="gateBtn" type="submit">Email me a code</button>
    <button class="btn" id="gateBack" type="button" hidden>Use another address</button>
    <p class="msg" id="gateMsg" role="status"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="bar">
      <p class="brand">GHOST ELECTRONICS</p>
      <div class="who"><span id="whoEmail"></span><button class="btn sm" id="reload" type="button">Refresh</button><button class="btn sm" id="signOut" type="button">Sign out</button></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#overview">Overview</a><a href="#board">Board</a><a href="#calendar">Calendar</a><a href="#inventory">Inventory</a><a href="#units">Units</a><a href="#garages">Garages</a><a href="#credits">Credits</a><a href="#pros">Pros</a><a href="#licences">Licences</a>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
// The project and its public key: safe to publish. Without a signed-in admin the database answers nothing.
const PROJECT = 'https://rkjkxoecchzsucqtmawg.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJramt4b2VjY2h6c3VjcXRtYXdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5Njg3MjcsImV4cCI6MjEwNzU0NDcyN30.DZInBj8R0l1VX8lwFiviBlse39x3-xmAEo0Wfp4q_8A';
// Ghost Electronics' licence keys, public halves (tools/studio/licence_keys.js): an uploaded licence is checked against them.
const LICENCE_KEYS = [{"id":0,"spki":"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEu42LvxMSsX7GwowozduZtXLKc7THAh10nSokwkBP+fhwrZi0IyDMVl6e/M8k93UA1KfvAy29kFGSbDyctwVZ3Q=="},{"id":1,"spki":"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEyVYbuK6HRwXo3BnGls7zzXStJXAlSJxcTnk6t9y2XcpaS025ihZ6N4iM7RwbyJe/UMdkvQl2KyRmo1CNMxq8Iw=="}];
const sb = supabase.createClient(PROJECT, ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const PRODUCT = { gauge:'Ghost Gauge', pro:'Ghost Gauge Pro', nano:'Ghost Gauge Nano' };
// times as the Sheet showed them: Doha, yyyy-mm-dd hh:mm
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Qatar', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
const when = v => { if (!v) return ''; const p = Object.fromEntries(fmt.formatToParts(new Date(v)).map(x => [x.type, x.value])); return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const day = v => (v ? when(v).slice(0, 10) : '');
const money = (m, cur) => (m == null ? 'not set' : `${(m / 100).toFixed(2)} ${cur || 'QAR'}`);
const signed = n => `<span class="${n > 0 ? 'plus' : 'minus'}">${n > 0 ? '+' : ''}${n}</span>`;
function toast(t, bad) { const el = $('#toast'); el.textContent = t; el.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => { el.className = 'toast'; }, 3200); }

// ---------- signing in: a code by email, nothing else ----------
let pendingEmail = '';
function gateStep(code) {
  $('#emailField').hidden = code; $('#codeField').hidden = !code; $('#gateBack').hidden = !code;
  $('#gateBtn').textContent = code ? 'Sign in' : 'Email me a code';
  $('#email').required = !code; $('#code').required = code;
  (code ? $('#code') : $('#email')).focus();
}
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('#gateMsg'), btn = $('#gateBtn');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '';
  try {
    if ($('#codeField').hidden) {
      pendingEmail = $('#email').value.trim().toLowerCase();
      const { error } = await sb.auth.signInWithOtp({ email:pendingEmail, options:{ shouldCreateUser:true } });
      if (error) throw error;
      msg.textContent = `A code is on its way to ${pendingEmail}. It works for 10 minutes.`;
      gateStep(true);
    } else {
      const { error } = await sb.auth.verifyOtp({ email:pendingEmail, token:$('#code').value.trim(), type:'email' });
      if (error) throw error;
      $('#code').value = '';
    }
  } catch (err) {
    msg.className = 'msg bad';
    msg.textContent = /only/i.test(err.message) ? 'This page is for Ghost Electronics only.' : /rate|seconds/i.test(err.message) ? 'Too many codes asked for. Wait a few minutes, then try again.'
      : /expired|invalid/i.test(err.message) ? 'That code is wrong or has run out. Ask for a new one.' : err.message;
  } finally { btn.disabled = false; }
});
$('#gateBack').addEventListener('click', () => { $('#gateMsg').textContent = ''; gateStep(false); });
$('#signOut').addEventListener('click', () => sb.auth.signOut());
$('#reload').addEventListener('click', () => load().then(render));

sb.auth.onAuthStateChange((_e, session) => { setTimeout(() => show(session), 0); });
let shownFor;                 // undefined until the first answer, so "nobody signed in" is shown too
async function show(session) {
  if (window.__previewData) return;           // the preview has no session and needs none
  const email = session?.user?.email || null;
  if (email === shownFor) return;
  shownFor = email;
  $('#gate').hidden = !!email; $('#app').hidden = !email;
  if (!email) { gateStep(false); return; }
  $('#whoEmail').textContent = email;
  me = email.toLowerCase();
  const { data:admin } = await sb.rpc('is_admin');
  if (!admin) { $('#view').innerHTML = '<p class="panel">This address isn’t one of Ghost Electronics’ admins.</p>'; return; }
  $('#view').innerHTML = '<p class="dim">Loading…</p>';
  await load(); render();
}

// ---------- the data: small enough to fetch whole ----------
let D = null;
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
async function load() {
  try {
    const [units, history, garages, licences, ledger, pros, prices, payments, counters, requests] = await Promise.all([
      q(sb.from('units_full').select('*').order('allocated_at', { ascending:false })),
      q(sb.from('unit_history').select('*').order('at', { ascending:false }).limit(5000)),
      q(sb.from('garages_summary').select('*').order('name')),
      q(sb.from('licences_status').select('*').order('issued', { ascending:false, nullsFirst:false })),
      q(sb.from('ledger').select('*').order('id', { ascending:false }).limit(2000)),
      q(sb.from('pros').select('*').order('created_at', { ascending:false })),
      q(sb.from('prices').select('*').order('sort')),
      q(sb.from('payments').select('*').order('created_at', { ascending:false }).limit(500)),
      q(sb.from('counters').select('*')),
      q(sb.from('licence_requests').select('*').order('created_at', { ascending:false }).limit(300)),
    ]);
    D = prep({ units, history, garages, licences, ledger, pros, prices, payments, counters, requests });
    [D.board, D.inv] = await Promise.all([loadBoard(), loadInv()]);
  } catch (e) { toast(`Couldn’t load: ${e.message}`, true); }
}

function prep(r) {
  return { ...r, board:r.board || null, inv:r.inv ? invPrep(r.inv) : null, requests:r.requests || [], counters:Object.fromEntries(r.counters.map(c => [c.name, Number(c.value)])), gname:Object.fromEntries(r.garages.map(g => [g.gid, g.name])) };
}

// ---------- the views, by the address's #part ----------
window.addEventListener('hashchange', render);
function render() {
  if (!D) return;
  const [page, arg] = decodeURIComponent(location.hash.slice(1) || 'overview').split('/');
  document.querySelectorAll('nav.tabs a').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + (page === 'unit' ? 'units' : page === 'garage' ? 'garages' : page === 'item' ? 'board' : ['part', 'receive', 'scan'].includes(page) ? 'inventory' : page)));
  document.querySelectorAll('nav.tabs a[aria-current]').forEach(a => a.setAttribute('aria-current', 'page'));
  const waiting = D.requests.filter(r => r.status === 'pending').length;
  $('nav.tabs a[href="#licences"]').innerHTML = `Licences${waiting ? ` <span class="count">${waiting}</span>` : ''}`;
  const v = $('#view');
  const views = { overview, units, unit, garages, garage, credits, pros, licences, board, item, calendar, inventory, part, receive, scan };
  const inv = ['inventory', 'part', 'receive', 'scan'].includes(page);
  document.body.classList.toggle('invpage', inv); v.classList.toggle('inv', inv);
  v.innerHTML = (views[page] || overview)(arg);
  window.scrollTo(0, 0);
}

function overview() {
  const u = D.units, by = p => u.filter(x => x.product === p).length;
  const pass = u.filter(x => x.result === 'PASS').length, fail = u.filter(x => x.result === 'FAIL').length;
  const credPro = D.garages.reduce((n, g) => n + Math.max(0, g.pro), 0), credScr = D.garages.reduce((n, g) => n + Math.max(0, g.screen), 0);
  const prosUp = D.pros.filter(p => !p.cancelled_at).length;
  const next = p => `GE-${p[0].toUpperCase()}-${String(D.counters['next_serial_' + p] || 1).padStart(6, '0')}`;
  const events = [
    ...D.history.slice(0, 40).map(h => ({ at:h.at, html:`<a class="ser" href="#unit/${esc(h.serial)}">${esc(h.serial)}</a> ${esc(h.event)}${h.result ? ` <span class="badge ${esc(h.result)}">${esc(h.result)}</span>` : ''}${h.detail ? ` <span class="dim">· ${esc(h.detail)}</span>` : ''}` })),
    ...D.ledger.slice(0, 40).map(l => ({ at:l.at, html:`<a href="#garage/${esc(l.gid)}">${esc(D.gname[l.gid])}</a> ${signed(l.delta)} ${esc(l.kind)} credit${Math.abs(l.delta) === 1 ? '' : 's'} <span class="dim">· ${esc(l.reason)}${l.serial ? ' · ' + esc(l.serial) : ''}${l.note ? ' · ' + esc(l.note) : ''}</span>` })),
  ].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 25);
  return `<h1>Overview</h1>
  <div class="tiles">
    <a class="tile" href="#units" style="text-decoration:none;color:inherit"><span>Units made</span><b>${u.length}</b><i>${by('gauge')} Gauge · ${by('pro')} Pro · ${by('nano')} Nano</i></a>
    <div class="tile"><span>Passed / failed</span><b>${pass} <span class="dim" style="font-size:18px">/ ${fail}</span></b><i>their last test</i></div>
    <a class="tile" href="#garages" style="text-decoration:none;color:inherit"><span>Garages</span><b>${D.garages.length}</b><i>${D.licences.filter(l => l.status === 'active' || l.status === 'runs out soon').length} licences in date</i></a>
    <a class="tile" href="#pros" style="text-decoration:none;color:inherit"><span>Pros set up</span><b>${prosUp}</b><i>${D.pros.filter(p => !p.cancelled_at && !p.used_at).length} not sent to yet</i></a>
    <a class="tile" href="#credits" style="text-decoration:none;color:inherit"><span>Credits held by garages</span><b>${credPro} <span class="dim" style="font-size:18px">/ ${credScr}</span></b><i>Pro / screen</i></a>
    <a class="tile" href="#licences" style="text-decoration:none;color:inherit"><span>Licence requests</span><b>${D.requests.filter(r => r.status === 'pending').length}</b><i>waiting for you</i></a>
    <div class="tile"><span>Next serials</span><b style="font-size:14px;line-height:1.7" class="mono">${next('gauge')}<br>${next('pro')}<br>${next('nano')}</b></div>
    ${D.inv ? `<a class="tile" href="#inventory/low" style="text-decoration:none;color:inherit"><span>Parts below their minimum</span><b style="${D.inv.items.some(i => !i.archived && !isTool(i) && lvl(i) === 'crit') ? 'color:var(--bad)' : ''}">${D.inv.items.filter(i => !i.archived && !isTool(i) && lvl(i) === 'crit').length}</b><i>of ${D.inv.items.filter(i => !i.archived).length} in the inventory</i></a>` : ''}
    ${D.board ? `<a class="tile" href="#board/todo" style="text-decoration:none;color:inherit"><span>Board steps that need you</span><b style="color:var(--gold)">${D.board.steps.filter(s => s.state !== 'Done' && s.needs_you).length}</b><i>${D.board.items.filter(i => i.stage !== 'Done').length} workstreams under way</i></a>` : ''}
  </div>
  <section class="panel"><h2>Latest</h2>${events.length ? `<ol class="timeline">${events.map(e => `<li><time>${when(e.at)}</time><div class="what">${e.html}</div></li>`).join('')}</ol>` : '<p class="empty">Nothing yet.</p>'}</section>`;
}

let uFilter = { text:'', product:'', result:'' };
function units() {
  const t = uFilter.text.toLowerCase();
  const rows = D.units.filter(u => (!uFilter.product || u.product === uFilter.product) && (!uFilter.result || u.result === uFilter.result)
    && (!t || [u.serial, u.code, u.mac, u.garage, u.customer, u.notes].some(x => String(x || '').toLowerCase().includes(t))));
  const seg = (k, opts) => `<div class="seg" role="group">${opts.map(([v, n]) => `<button type="button" data-f="${k}" data-v="${v}" aria-pressed="${uFilter[k] === v}">${n}</button>`).join('')}</div>`;
  setTimeout(() => {
    const s = $('#uSearch'); if (s) { s.value = uFilter.text; s.addEventListener('input', () => { uFilter.text = s.value; const c = s.selectionStart; render(); const n = $('#uSearch'); n.focus(); n.setSelectionRange(c, c); }); }
    document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { uFilter[b.dataset.f] = b.dataset.v; render(); }));
  });
  return `<h1>Units</h1>
  <div class="tools"><input type="search" id="uSearch" placeholder="Serial, code, chip MAC, garage, customer, note" aria-label="Search units">
    ${seg('product', [['', 'All'], ['gauge', 'Gauge'], ['pro', 'Pro'], ['nano', 'Nano']])}${seg('result', [['', 'Any'], ['PASS', 'Passed'], ['FAIL', 'Failed'], ['allocated', 'Not tested']])}</div>
  <div class="tablewrap"><table><thead><tr><th>Serial</th><th>Code</th><th>Product</th><th>Result</th><th>Firmware</th><th>Last tested</th><th>Garage</th><th>Notes</th></tr></thead><tbody>
  ${rows.map(u => `<tr class="go" data-href="#unit/${esc(u.serial)}"><td><a class="ser" href="#unit/${esc(u.serial)}">${esc(u.serial)}</a></td><td class="mono">${esc(u.code)}</td><td>${esc(PRODUCT[u.product])}</td>
    <td>${u.result ? `<span class="badge ${esc(u.result)}">${esc(u.result)}</span>` : ''}</td><td class="mono">${esc(u.firmware)}</td><td>${when(u.finished_at)}</td><td>${esc(u.garage)}</td><td class="dim">${esc(String(u.notes || '').slice(0, 60))}</td></tr>`).join('')
    || '<tr><td colspan="8" class="empty">No units match.</td></tr>'}
  </tbody></table></div>`;
}
document.addEventListener('click', e => { const r = e.target.closest('tr.go[data-href]'); if (r && !e.target.closest('a,button,input')) location.hash = r.dataset.href; });

function unit(serial) {
  const u = D.units.find(x => x.serial === serial);
  if (!u) return '<a class="back" href="#units">‹ Units</a><p class="panel">No unit with that serial.</p>';
  const hist = D.history.filter(h => h.serial === serial);
  const pro = D.pros.find(p => p.serial === serial);
  setTimeout(() => {
    $('#uSave').addEventListener('click', async () => {
      const patch = { notes:$('#uNotes').value, customer:$('#uCustomer').value || null };
      if (!pro) Object.assign(patch, { garage:$('#uGarage').value || null, fitted:$('#uFitted').value || null, screens:$('#uScreens').value || null });
      const { error } = await sb.from('units').update(patch).eq('serial', serial);
      if (error) return toast(error.message, true);
      toast('Saved'); await load(); render();
    });
    $('#uNoteAdd').addEventListener('click', async () => {
      const text = $('#uNote').value.trim(); if (!text) return;
      const { error } = await sb.rpc('admin_note', { p_serial:serial, p_text:text });
      if (error) return toast(error.message, true);
      toast('Added to its history'); await load(); render();
    });
  });
  return `<a class="back" href="#units">‹ Units</a>
  <h1><span class="ser" style="font-size:18px">${esc(u.serial)}</span> <span class="dim" style="font-size:14px">· ${esc(u.code)} · ${esc(PRODUCT[u.product])}</span></h1>
  <div class="two">
    <section class="panel"><h2>The board</h2><dl class="kv">

// An uploaded .ghostlicence, checked here before it goes up: made with Ghost Electronics' key, for this
// request's laptop. (The database checks the laptop again; Studio checks everything again before using it.)
const unb64 = s => Uint8Array.from(atob(String(s).replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - String(s).length % 4) % 4)), c => c.charCodeAt(0));
function derToRaw(der) {
  let i = der[1] & 0x80 ? 2 + (der[1] & 0x7f) : 2; const out = new Uint8Array(64);
  for (const at of [0, 32]) { let len = der[i + 1], p = i + 2; i = p + len; while (len > 32 && der[p] === 0) { p++; len--; } out.set(der.subarray(p, p + len), at + 32 - len); }
  return out;
}
async function checkLicenceFile(file, req) {
  if (!file || file.format !== 'ghost-studio-licence' || typeof file.payload !== 'string') throw new Error('That isn’t a .ghostlicence file.');
  const bytes = unb64(file.payload), p = JSON.parse(new TextDecoder().decode(bytes));
  if (p.machine !== req.machine || p.pub !== req.pub) throw new Error(`That licence is for another laptop (${p.code}), not ${req.code}.`);
  const key = LICENCE_KEYS.find(k => k.id === file.key);
  if (!key) throw new Error('That licence names a key Ghost Electronics doesn’t have.');
  const hex = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(b => b.toString(16).padStart(2, '0')).join('');
  const pub = await crypto.subtle.importKey('spki', unb64(key.spki.replace(/\+/g, '-').replace(/\//g, '_')), { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, pub, derToRaw(unb64(file.sig)), new TextEncoder().encode('GGLC1|' + hex));
  if (!ok) throw new Error('That licence wasn’t made with Ghost Electronics’ key, or it was changed.');
  return p;
}

async function all(table, order) {           // the API hands out 1000 rows at a time
  const out = [];
  for (let from = 0; ; from += 1000) {
    const rows = await q(sb.from(table).select('*').order(order).range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}

    return { items, steps, notes, changes };
  } catch (e) { toast(`Couldn’t load the board: ${e.message}`, true); return null; }
}
// A redraw after a save keeps whatever is still being typed elsewhere on the page: each field that differs from

async function shrinkPhoto(file) {
  try {

    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(b => ok(b || file), 'image/jpeg', 0.85));
  } catch { return file; }
}

}

// ---------- Can I build? A product × quantity against the shelf ----------
let buView = { bom:'', qty:1, naming:false };

      const text = buy.length ? `${b.name} × ${q}: still to buy\n` + buy.map(({ r, n }) => `${perStr(n, r.it.unit)} × ${r.it.name} (${[r.it.sku, r.it.lcsc && 'LCSC ' + r.it.lcsc, r.it.supplier].filter(Boolean).join(', ')})`).join('\n') : '';

  return `<div class="col" style="gap:6px"><a class="back lbl" href="#inventory">‹ Inventory</a><h1 class="t">Can I build?</h1>

  <div class="row" style="gap:16px">
    <div class="seg" role="group" aria-label="Product">${boms.map(x => `<button class="segb" type="button" data-bom="${esc(x.id)}" aria-pressed="${x.id === buView.bom}">${esc(x.name)}</button>`).join('')}<button class="segb" type="button" id="buNew" aria-label="Start a build list" title="Start a build list">+</button></div>
    <div class="row"><button class="step" type="button" id="buDec" aria-label="One fewer">−</button><input class="midnum" id="buQty" inputmode="numeric" value="${q}" aria-label="Units"><button class="step" type="button" id="buInc" aria-label="One more">+</button><span class="lbl">Units</span></div>
  </div>
  ${buView.naming ? `<section class="panelform" style="max-width:720px"><span class="lbl">A new build list</span><div class="grid2">
    <label class="field"><span class="lbl">Name</span><input class="inp" id="nbName" placeholder="Fake X3 box"></label>
    <label class="field"><span class="lbl">Ghost Factory takes it out when a unit passes</span><select class="inp" id="nbProduct"><option value="">Never (not a product it tests)</option>${['gauge', 'pro', 'nano'].filter(p => !taken.has(p)).map(p => `<option value="${p}">${esc(PRODUCT[p])}</option>`).join('')}</select></label></div>
    <div class="row"><button class="ib gold" type="button" id="nbSave">Start it</button><button class="ib" type="button" id="nbCancel">Cancel</button></div></section>` : ''}
  ${!b ? '<p class="c2">No build lists yet. Start one with +.</p>' : `
  <div class="tiles4">
    <div class="tile hero"><span class="lbl">Buildable now</span><span class="num" style="font-size:60px;line-height:1;color:${canCol}">${can == null ? '—' : num(can)}</span><small>${can == null ? 'nothing on its list yet' : can >= q ? `enough for all ${q}` : `of the ${q} asked for`}</small></div>
    <div class="tile"><span class="lbl">Lines short</span><span class="num" style="font-size:38px;color:${shortN ? LV.crit : '#fff'}">${shortN}</span><small>of ${rows.length} we fit by hand</small></div>

    <div class="row"><input class="inp" id="buNote" placeholder="What it’s for (optional)" style="width:220px"><button class="ib" type="button" id="buCopy">Copy shopping list</button><button class="ib gold" type="button" id="buHold" ${rows.length ? '' : 'disabled'}>Reserve for ${q}</button></div>
  </div>`}
  ${holds.length ? `<div class="c2 col" style="gap:4px"><span class="lbl" style="padding-bottom:6px">Held for builds</span>

      return `<div><span class="num" style="font-size:12px">${esc(day(h.created_at))}</span><span><b style="font-weight:600">${esc(hb ? hb.name : h.bom_id)}</b>${h.note ? ` · ${esc(h.note)}` : ''} <span class="soft">· ${who(h.updated_by)}</span></span>
      <span class="num" style="font-size:14px">${num(h.units)}</span><span class="lbl">of ${num(h.asked)} left</span><span class="row" style="justify-content:flex-end"><button class="ib sm" type="button" data-release="${h.id}">Release</button></span></div>`; }).join('')}</div></div>` : ''}`;
}

const R0 = () => ({ arg:undefined, text:'', pick:null, adding:false, qty:1, unit:'pcs', prods:{}, order:'', print:true, photo:null, photoUrl:'', extra:{}, more:false, onOrder:false });
let rView = R0();

    if (arg) {

      if (it) {

        const o = I().orders.find(x => x.item_id === it.id && x.status === 'open' && x.left > 0 && (!line || String(x.id) === line));

      <button class="ib" type="button" id="rScan" style="min-height:48px">${SVG.scan}<span>Scan a bag</span></button></div>

      ${hits.map(h => `<button class="hit" type="button" data-pick="${h.id}"><span style="display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0"><span style="font-size:14px;color:#c9d0d4">${esc(h.name)}</span>
        <span style="font-size:13px;color:#7b8488">${esc([h.sku, h.lcsc && 'LCSC ' + h.lcsc, h.bin].filter(Boolean).join(' · '))} · ${isTool(h) ? esc(h.tool_state || 'On bench') : `${num(h.on_hand)} on hand`}</span></span><span class="lbl" style="font-size:10px">This one</span></button>`).join('')}

  wrapText(g, i.name, tw, 4).forEach((line, k) => g.fillText(line, tx, 22 + fs * 0.78 + 34 + k * 26));

  g.fillText(i.sku, tx, H - 16);
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let k = 0; k < d.length; k += 4) { const v = d[k] * 0.3 + d[k + 1] * 0.59 + d[k + 2] * 0.11 < 150 ? 0 : 255; d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255; }
  g.putImageData(img, 0, 0);
  return canvas;
}
async function labelCanvases(items) { return Promise.all(items.map(i => drawLabel(document.createElement('canvas'), i))); }
async function saveLabels(items) {
  for (const [k, c] of (await labelCanvases(items)).entries()) {
    const a = document.createElement('a'); a.download = `${items[k].sku}-label.png`; a.href = c.toDataURL('image/png'); a.click();
    await new Promise(r => setTimeout(r, 250));
  }
}
async function printLabels(items, quiet) {
  if (!items.length) return;
  if (!B1.supported) { await saveLabels(items); if (!quiet) toast('Saved: print the label from the NIIMBOT app'); else toast('Label saved as a picture'); return; }
  try {
    if (!await B1.choose()) return;
    toast(`Printing ${items.length} label${items.length === 1 ? '' : 's'}…`);
    await B1.print(await labelCanvases(items));
    toast(`Printed ${items.length} label${items.length === 1 ? '' : 's'}`);
  } catch (e) { toast(e.message, true); }
}
// The B1 over its USB-C cable from Chrome (Web Serial), the same packets Ghost Factory's Niimbot.swift sends.
const B1 = {
  supported: 'serial' in navigator,
  async choose() {                      // asked while the click still counts: Chrome only shows its port picker then
    try { if ((await navigator.serial.getPorts()).length) return true; await navigator.serial.requestPort(); return true; }
    catch (e) { if (e.name !== 'NotFoundError') toast(e.message, true); return false; }
  },
  problem(code) {
    return { 1:'The B1’s lid is open.', 2:'The B1 is out of labels.', 3:'The B1’s battery is too low to print. Charge it.', 4:'The B1’s battery is too low to print. Charge it.',
      5:'The print was cancelled on the B1.', 7:'The B1 is too hot; let it rest a minute.', 8:'The B1 lost the label. Check the roll and that the lid is shut.',
      9:'The B1 is busy. Try again in a moment.', 16:'The B1 doesn’t like these labels.' }[code] || `The B1 stopped with error ${code}.`;
  },
  async print(canvases, density = 3) {
    const port = (await navigator.serial.getPorts())[0];
    if (!port) throw new Error('Pick the NIIMBOT B1 when Chrome asks for its port.');
    try { await port.open({ baudRate:115200 }); } catch (e) { if (!/already open/i.test(e.message)) throw new Error('Couldn’t open the B1. Close the NIIMBOT app and Ghost Factory if either is using it.'); }
    const writer = port.writable.getWriter(), reader = port.readable.getReader();
    let buf = [], stop = false;
    const pump = (async () => { try { while (!stop) { const { value, done } = await reader.read(); if (done) break; if (value) buf.push(...value); } } catch {} })();
    const pkt = (cmd, data = []) => { let x = cmd ^ data.length; data.forEach(b => { x ^= b; }); const body = [0x55, 0x55, cmd, data.length, ...data, x, 0xAA, 0xAA]; return new Uint8Array(cmd === 0xC1 ? [3, ...body] : body); };
    const u16 = n => [(n >> 8) & 0xFF, n & 0xFF];
    const parse = () => {
      for (let i = 0; i + 7 <= buf.length; i++) {
        if (buf[i] !== 0x55 || buf[i + 1] !== 0x55) continue;
        const len = buf[i + 3], end = i + 4 + len + 3;
        if (end > buf.length) return null;
        const cmd = buf[i + 2], data = buf.slice(i + 4, i + 4 + len);
        if (buf[end - 2] === 0xAA && buf[end - 1] === 0xAA && buf[i + 4 + len] === data.reduce((a, b) => a ^ b, cmd ^ len)) { buf = buf.slice(end); return { cmd, data }; }
      }
      return null;
    };
    const ask = async (cmd, data, expect, ms) => {
      await writer.write(pkt(cmd, data));
      const end = Date.now() + ms;
      while (Date.now() < end) {
        let p; while ((p = parse())) { if (expect.includes(p.cmd)) return p; if (p.cmd === 0xDB) throw new Error(B1.problem(p.data[0])); }
        await new Promise(r => setTimeout(r, 30));
      }
      throw new Error('The NIIMBOT B1 stopped answering. Is it switched on?');
    };
    const ok = async (cmd, data, reply, what) => { const r = await ask(cmd, data, [reply], 3000); if (r.data[0] === 0) throw new Error(`The NIIMBOT B1 wouldn’t ${what}.`); };
    try {
      await ask(0xC1, [1], [0xC2], 1000).catch(() => {});
      await ask(0x40, [8], [0x48], 1500).catch(() => { throw new Error('That port isn’t a NIIMBOT B1. Unplug other USB devices and try again.'); });
      for (const c of canvases) {
        const W = c.width, H = c.height, px = c.getContext('2d').getImageData(0, 0, W, H).data;
        const rows = []; for (let y = 0; y < H; y++) { const bytes = new Array(W / 8).fill(0); for (let x = 0; x < W; x++) if (px[(y * W + x) * 4] < 128) bytes[x >> 3] |= 0x80 >> (x & 7); rows.push(bytes); }
        await ok(0x21, [Math.max(1, Math.min(5, density))], 0x31, 'set the darkness');
        await ok(0x23, [1], 0x33, 'set the label type');
        await ok(0x01, [0, 1, 0, 0, 0, 0, 0], 0x02, 'start');
        await ok(0x03, [1], 0x04, 'start the page');
        await ok(0x13, [...u16(H), ...u16(W), ...u16(1)], 0x14, 'take the label’s size');
        for (let y = 0; y < H;) {
          let n = 1; while (y + n < H && n < 255 && rows[y + n].join() === rows[y].join()) n++;
          const b = rows[y];
          if (b.every(v => v === 0)) await writer.write(pkt(0x84, [...u16(y), n]));
          else { const third = [0, 0, 0]; b.forEach((v, k) => { let c2 = 0; for (let s = v; s; s &= s - 1) c2++; third[Math.min(2, Math.floor(k / 16))] += c2; });
            await writer.write(pkt(0x85, [...u16(y), ...third.map(t => Math.min(t, 255)), n, ...b])); }
          y += n;
        }
        await ok(0xE3, [1], 0xE4, 'finish the page');
        const deadline = Date.now() + 15000;
        for (;;) {
          const s = await ask(0xA3, [1], [0xB3], 2000);
          if (s.data.length >= 10 && s.data[6] !== 0) throw new Error(B1.problem(s.data[6]));
          if (s.data.length >= 2 && ((s.data[0] << 8) | s.data[1]) >= 1) break;
          if (Date.now() > deadline) throw new Error('The B1 took the label but never said it printed. Check it has labels and the lid is shut.');
          await new Promise(r => setTimeout(r, 300));
        }
        await ask(0xF3, [1], [0xF4], 3000).catch(() => {});
      }
    } finally {
      stop = true;
      try { await reader.cancel(); } catch {}
      await pump; try { reader.releaseLock(); writer.releaseLock(); } catch {}
      try { await port.close(); } catch {}
    }
  },
};

// ---------- the camera: a bag's or a bin's QR code ----------
async function scanCode(onHit, prompt) {
  if (!navigator.mediaDevices?.getUserMedia) { toast('This browser can’t use the camera. Open the page on the phone.', true); return; }
  const box = document.createElement('div');
  box.className = 'scanner';
  box.innerHTML = `<video playsinline muted></video><p>${esc(prompt)}</p><button class="btn" type="button" style="min-height:44px;padding:0 22px">Cancel</button>`;
  document.body.appendChild(box);
  const video = box.querySelector('video');
  let stream, done = false;
  const end = () => { done = true; stream?.getTracks().forEach(t => t.stop()); box.remove(); };
  box.querySelector('button').addEventListener('click', end);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    video.srcObject = stream; await video.play();
    let det = null;
    if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats:['qr_code'] }); } catch {} }
    if (!det) await loadScript(JSQR_LIB);
    const c = document.createElement('canvas'), g = c.getContext('2d', { willReadFrequently:true });
    const tick = async () => {
      if (done) return;
      let text = null;
      try {
        if (det) { const codes = await det.detect(video); text = codes[0]?.rawValue || null; }
        else if (video.videoWidth) {
          const k = Math.min(1, 720 / video.videoWidth); c.width = video.videoWidth * k; c.height = video.videoHeight * k;
          g.drawImage(video, 0, 0, c.width, c.height);
          text = window.jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height)?.data || null;
        }
      } catch {}
      if (text) { end(); onHit(text); return; }
      setTimeout(tick, 120);
    };
    tick();
  } catch (e) { end(); toast(e.name === 'NotAllowedError' ? 'The camera wasn’t allowed. Allow it for this page in the browser’s settings.' : e.message, true); }
}

// ---------- On order: every line still to arrive ----------
function invOrders() {
  const open = I().orders.filter(o => o.status === 'open'), done = I().orders.filter(o => o.status !== 'open').slice(0, 60);
  setTimeout(() => document.querySelectorAll('[data-ocancel]').forEach(b => b.addEventListener('click', () => {
    if (confirm('Cancel this order? What has already arrived stays on the shelf.')) writeInv(sb.from('inv_orders').update({ status:'cancelled' }).eq('id', +b.dataset.ocancel), 'Order cancelled');
  })));
  const row = o => { const it = I().byId.get(o.item_id), cls = o.status === 'open' ? 'lv-cool' : o.status === 'closed' ? 'lv-ok' : 'lv-off';
    return `<tr><td><span class="num" style="font-size:12px">${esc(o.ordered_on)}</span></td><td>${it ? `<a class="pn" href="#part/${it.id}">${esc(it.name)}</a>` : '—'}</td><td>${esc(o.supplier) || '—'}${o.ref ? ` <span class="mono">· ${esc(o.ref)}</span>` : ''}</td>
    <td class="r"><span class="num" style="font-size:14px">${num(o.qty)}</span></td><td class="r"><span class="num" style="font-size:14px">${num(o.got)}</span></td><td class="r"><span class="num ${o.left && o.status === 'open' ? 'lv-cool' : 'lv-off'}" style="font-size:14px">${o.status === 'open' ? num(o.left) : '—'}</span></td>
    <td><span class="lbl ${cls}">${o.status === 'open' ? (o.got ? 'Part here' : 'In transit') : o.status === 'closed' ? 'Received' : 'Cancelled'}</span></td>
    <td class="r" style="white-space:nowrap">${o.status === 'open' && it ? `<a class="ib sm" href="#receive/${it.id}:${o.id}">Receive</a> <button class="ib sm" type="button" data-ocancel="${o.order_id}">Cancel</button>` : ''}</td></tr>`; };
  const table = (list, empty) => `<div class="tw c1"><table style="min-width:860px"><thead><tr><th>Ordered</th><th>Part</th><th>Supplier</th><th class="r">Qty</th><th class="r">Arrived</th><th class="r">Still to come</th><th>State</th><th></th></tr></thead><tbody>
    ${list.map(row).join('') || `<tr><td colspan="8" style="text-align:center;padding:28px;color:#7b8488">${empty}</td></tr>`}</tbody></table></div>`;
  return `<div class="col" style="gap:6px"><a class="back lbl" href="#inventory">‹ Inventory</a><h1 class="t">On order</h1>
    <p class="lede">What has been bought and hasn't all arrived. A part's page records an order; receiving against it counts it down, and the order closes itself when the last of it is in.</p></div>
  ${table(open, 'Nothing on order.')}
  ${done.length ? `<span class="lbl">Received and cancelled</span>${table(done, '')}` : ''}`;
}

// ---------- Stocktake: type what each bin holds; only the rows typed in are saved, each as a count ----------
let cView = { cat:'', bin:'', text:'' };
function invCount() {
  const rows = I().items.filter(i => !i.archived && !isTool(i) && (!cView.cat || i.category === cView.cat) && (!cView.bin || i.bin === cView.bin) && matches(i, cView.text))
    .sort((a, b) => (a.bin || '~').localeCompare(b.bin || '~', 'en', { numeric:true }) || a.name.localeCompare(b.name, 'en', { numeric:true }));
  const lastCount = Object.fromEntries([...I().moves].reverse().filter(m => m.kind === 'counted').map(m => [m.item_id, m.at]));
  setTimeout(() => {
    $('#cSearch')?.addEventListener('input', e => { cView.text = e.target.value; redraw(); });
    $('#cCat')?.addEventListener('change', e => { cView.cat = e.target.value; redraw(); });
    $('#cBin')?.addEventListener('change', e => { cView.bin = e.target.value; redraw(); });
    const typed = () => [...document.querySelectorAll('[data-cnt]')].filter(el => el.value !== '');
    const sum = () => { const n = typed().length; $('#cSave').disabled = !n; $('#cSave').textContent = n ? `Save ${n} count${n === 1 ? '' : 's'}` : 'Save counts'; };
    document.querySelectorAll('[data-cnt]').forEach(el => {
      const show = () => { const i = I().byId.get(+el.dataset.cnt), d = el.value === '' ? null : +el.value - i.on_hand;
        $(`#cd${i.id}`).innerHTML = d == null ? '' : d === 0 ? '<span class="soft">right</span>' : deltaInv(d); sum(); };
      el.addEventListener('input', show); if (el.value !== '') show();
    });
    sum();
    $('#cSave').addEventListener('click', async e => {
      const list = typed();
      if (list.some(el => isNaN(+el.value) || +el.value < 0)) { toast('A count is 0 or more.', true); return; }
      e.target.disabled = true;
      const rows = list.map(el => ({ item_id:+el.dataset.cnt, kind:'counted', count_to:+el.value, note:'stocktake' }));
      if (!await writeInv(sb.from('inv_moves').insert(rows), `Saved ${rows.length} count${rows.length === 1 ? '' : 's'}`, list.map(el => `[data-cnt="${el.dataset.cnt}"]`))) e.target.disabled = false;
    });
  });
  const bins = [...new Set(I().items.map(i => i.bin).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'en', { numeric:true }));
  return `<div class="col" style="gap:6px"><a class="back lbl" href="#inventory">‹ Inventory</a><h1 class="t">Stocktake</h1>
    <p class="lede">Go bin by bin and type what you find. Rows left empty aren’t touched; each one typed in is saved as a count, and the difference goes in its history.</p></div>
  <div class="row">
    <label class="search">${SVG.search}<span class="sr">Search</span><input type="search" id="cSearch" value="${esc(cView.text)}" placeholder="Name, LCSC number, sku, bin" autocomplete="off"></label>
    <select class="inp" id="cCat" aria-label="Category" style="width:auto">${opts(INV_CATS.filter(c => c !== 'Tools'), cView.cat, 'All categories')}</select>
    <select class="inp" id="cBin" aria-label="Bin" style="width:auto">${opts(bins, cView.bin, 'All bins')}</select>
    <button class="ib gold" id="cSave" type="button" disabled>Save counts</button>
  </div>
  <div class="tw c1"><table style="min-width:760px"><thead><tr><th>Bin</th><th>Part</th><th class="r">Expected</th><th class="r">Found</th><th class="r">Difference</th><th>Last counted</th></tr></thead><tbody>
    ${rows.map(i => `<tr><td><span class="num" style="font-size:12px;color:#c9d0d4">${esc(i.bin) || '—'}</span></td><td><a class="pn" href="#part/${i.id}">${esc(i.name)}</a><br><span class="mono">${esc([i.sku, i.lcsc].filter(Boolean).join(' · '))}</span></td>
      <td class="r"><span class="num" style="font-size:14px;color:${lvInk(lvl(i))}">${num(i.on_hand)}</span> <span class="lbl" style="font-size:10px">${uTag(i)}</span></td>
      <td class="r"><input class="inp n" data-cnt="${i.id}" type="number" min="0" step="any" inputmode="decimal" aria-label="Found: ${esc(i.name)}" style="width:110px;text-align:right"></td>
      <td class="r num" id="cd${i.id}" style="font-size:14px"></td><td class="soft">${lastCount[i.id] ? esc(day(lastCount[i.id])) : 'never'}</td></tr>`).join('')
      || '<tr><td colspan="6" style="text-align:center;padding:28px;color:#7b8488">Nothing to count here.</td></tr>'}
  </tbody></table></div>`;
}

if (window.__previewData) { D = prep(window.__previewData); me = window.__previewData.me || ''; $('#gate').hidden = true; $('#app').hidden = false; $('#whoEmail').textContent = 'preview'; render(); }
else sb.auth.getSession().then(({ data }) => show(data.session));
