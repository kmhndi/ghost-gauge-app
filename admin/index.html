<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ghost Electronics</title>
<!-- Ghost Electronics' own page (tools/admin/README.md): the production log, garages, licences, credits and
     Pros on Supabase. The page is public; what it shows comes only to a signed-in admin, and the database
     enforces that (migrations/20261014150000_admin_page.sql), not this page. -->
<style>
@font-face { font-family: "Orbitron"; src: url("Orbitron.ttf") format("truetype"); font-weight: 400 900; font-display: swap; }
:root {
  --bg: #0A0B0D; --panel: #121418; --panel2: #171a1f; --line: #23272E; --line2: #2f343c;
  --ink: #EDEFF2; --dim: #8A9099; --gold: #FFC20E; --ok: #35D07F; --bad: #FF5A4E; --warn: #FFA23A; --cool: #5AB8FF;
  --readout: "Orbitron", ui-monospace, SFMono-Regular, Menlo, monospace;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gold); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }

/* sign in */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate form { width: min(380px, 100%); display: grid; gap: 14px; }
.brand { font: 700 15px/1 var(--readout); letter-spacing: 6px; text-align: center; margin: 0 0 6px; }
.brand small { display: block; font: 600 10px/1 var(--readout); letter-spacing: 4px; color: var(--dim); margin-top: 10px; }
label { display: grid; gap: 6px; color: var(--dim); font-size: 12.5px; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; min-width: 0; color: var(--ink); }
input::placeholder, textarea::placeholder { color: #5b616a; }
textarea { resize: vertical; min-height: 64px; }
input.code { font: 700 26px/1 var(--readout); letter-spacing: 10px; text-align: center; }
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--dim); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #111; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.msg { min-height: 20px; color: var(--dim); font-size: 13px; margin: 0; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }

/* the page */
header.top { position: sticky; top: 0; z-index: 5; background: rgba(10,11,13,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1200px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar .brand { text-align: start; margin: 0; font-size: 13px; letter-spacing: 5px; }
.bar .who { margin-inline-start: auto; color: var(--dim); font-size: 12.5px; display: flex; gap: 10px; align-items: center; }
nav.tabs { max-width: 1200px; margin: 0 auto; padding: 8px 12px 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { color: var(--dim); text-decoration: none; padding: 9px 12px 11px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--gold); }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 18px; }
h1 { font: 700 18px/1.2 var(--readout); letter-spacing: 2px; margin: 4px 0 0; }
h2 { font: 700 11px/1 var(--readout); letter-spacing: 2.5px; color: var(--dim); margin: 0 0 12px; text-transform: uppercase; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
.tile b { font: 800 30px/1.1 var(--readout); }
.tile span { color: var(--dim); font-size: 12.5px; }
.tile i { font-style: normal; color: var(--dim); font-size: 12px; }
.two { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input[type=search] { flex: 1 1 220px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--dim); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 11.5px; letter-spacing: .4px; position: sticky; top: 0; background: var(--panel); }
tr:last-child td { border-bottom: 0; }
tbody tr.go { cursor: pointer; }
tbody tr.go:hover td { background: var(--panel2); }
td.wrap { white-space: normal; min-width: 200px; }
.ser { font: 700 12.5px/1 var(--readout); letter-spacing: 1px; color: var(--gold); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.dim { color: var(--dim); }
.badge { display: inline-block; font: 700 10.5px/1 var(--readout); letter-spacing: 1px; padding: 4px 7px; border-radius: 6px; border: 1px solid currentColor; }
.badge.PASS, .badge.active { color: var(--ok); } .badge.FAIL, .badge.cancelled, .badge.ran { color: var(--bad); }
.badge.allocated, .badge.soon { color: var(--warn); } .badge.demo { color: var(--gold); }
.plus { color: var(--ok); } .minus { color: var(--bad); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.kv dt { color: var(--dim); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); align-items: end; }
.form .full { grid-column: 1 / -1; }
ol.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
ol.timeline li { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
ol.timeline li:last-child { border-bottom: 0; }
ol.timeline time { color: var(--dim); font-size: 12.5px; }
ol.timeline .what { overflow-wrap: anywhere; }
ol.timeline .what b { font-weight: 600; }
.back { color: var(--dim); text-decoration: none; font-size: 13px; }
.count { display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 9px; background: var(--gold); color: #111; font-size: 11px; font-weight: 700; text-align: center; }
.badge.revoked { color: var(--bad); }
.req { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.req:last-child { border-bottom: 0; }
.req .tools { gap: 6px; }
.empty { color: var(--dim); padding: 18px; text-align: center; }
.toast { position: fixed; inset-inline: 0; bottom: 18px; margin: 0 auto; width: max-content; max-width: calc(100vw - 32px); background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.bad { border-color: var(--bad); }
@media (max-width: 560px) { ol.timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; } .tile b { font-size: 24px; } }

/* the board: workstreams by stage, their steps as rev blocks */
.kanban { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(210px, 1fr)); overflow-x: auto; align-items: start; padding-bottom: 4px; }
@media (max-width: 900px) { .kanban { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 8px; align-content: start; min-height: 90px; border-radius: 14px; padding: 2px; }
.col.over { background: var(--panel2); outline: 1px dashed var(--dim); }
.col > header { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 6px 8px; border-bottom: 1px solid var(--line); }
.col > header b { font: 700 11px/1 var(--readout); letter-spacing: 2px; text-transform: uppercase; }
.card { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: inherit; text-decoration: none; cursor: grab; min-width: 0; }
.card:hover { border-color: var(--line2); }
.card .t { font-weight: 600; line-height: 1.3; }
.card .m { color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.card .n { color: var(--dim); font-size: 12.5px; line-height: 1.4; }
.card .n b { color: var(--ink); font-weight: 600; }
.card .w { font-size: 12.5px; line-height: 1.4; color: var(--warn); }
.blocks { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; vertical-align: middle; }
.blocks i { width: 9px; height: 7px; border-radius: 2px; background: var(--line2); }
.blocks i.Done { background: var(--ok); } .blocks i.Doing { background: var(--ink); } .blocks i.Blocked { background: var(--bad); }
.stage { display: inline-block; font: 700 10px/1 var(--readout); letter-spacing: 1px; padding: 4px 7px; border-radius: 6px; border: 1px solid currentColor; text-transform: uppercase; white-space: nowrap; }
.stage.Idea { color: var(--dim); } .stage.Designed { color: var(--cool); } .stage.Building { color: var(--gold); } .stage.Testing { color: var(--warn); } .stage.Done { color: var(--ok); }
.by { font-size: 11.5px; color: var(--dim); overflow-wrap: anywhere; }
.by b, .you { color: var(--gold); font-weight: 600; }
ol.steps { list-style: none; margin: 0; padding: 0; }
ol.steps li { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
ol.steps li:last-child { border-bottom: 0; }
ol.steps .f { display: grid; gap: 6px; min-width: 0; }
ol.steps .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
ol.steps select, ol.steps input, .tablewrap select { padding: 6px 8px; border-radius: 8px; font-size: 13px; }
ol.steps li.Done input.txt { color: var(--dim); }
ol.steps li.Blocked > select { border-color: var(--bad); } ol.steps li.Doing > select { border-color: var(--ink); } ol.steps li.Done > select { border-color: var(--ok); }
.check { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 12.5px; }
.check input { width: auto; }
@media (max-width: 560px) { ol.steps li { grid-template-columns: minmax(0, 1fr) auto; } ol.steps li > select { grid-column: 1 / -1; } }

/* the calendar: Sunday first, as the week runs in Qatar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { color: var(--dim); font: 600 10.5px/1 var(--readout); letter-spacing: 1px; text-align: center; padding: 6px 0; }
.cal button.d { min-height: 96px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: start; display: grid; align-content: start; gap: 3px; cursor: pointer; min-width: 0; overflow: hidden; }
.cal button.d.out { opacity: .4; }
.cal button.d.today { border-color: var(--gold); }
.cal button.d.sel { background: var(--panel2); border-color: var(--ink); }
.cal .num { font: 700 12px/1 var(--readout); }
.cal .e { font-size: 11px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-inline-start: 3px solid var(--line2); padding-inline-start: 4px; }
.cal .e.note { border-color: var(--gold); } .cal .e.release { border-color: var(--cool); } .cal .e.done { border-color: var(--ok); } .cal .e.due { border-color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; background: var(--line2); }
.legend .note::before { background: var(--gold); } .legend .release::before { background: var(--cool); } .legend .done::before { background: var(--ok); } .legend .due::before { background: var(--warn); }
ul.day { list-style: none; margin: 0; padding: 0; }
ul.day li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
ul.day li:last-child { border-bottom: 0; }
@media (max-width: 640px) {
  .cal button.d { min-height: 58px; padding: 5px; }
  .cal .e { font-size: 0; height: 4px; padding: 0; border: 0; border-radius: 2px; background: var(--line2); }
  .cal .e.note { background: var(--gold); } .cal .e.release { background: var(--cool); } .cal .e.done { background: var(--ok); } .cal .e.due { background: var(--warn); }
}
</style>
</head>
<body>

<section class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="on">
    <p class="brand">GHOST ELECTRONICS<small>PRODUCTION · GARAGES · CREDITS</small></p>
    <label id="emailField">Email
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
    </label>
    <label id="codeField" hidden>The 6-digit code we emailed you
      <input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000">
    </label>
    <button class="btn gold" id="gateBtn" type="submit">Email me a code</button>
    <button class="btn" id="gateBack" type="button" hidden>Use another address</button>
    <p class="msg" id="gateMsg" role="status"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="bar">
      <p class="brand">GHOST ELECTRONICS</p>
      <div class="who"><span id="whoEmail"></span><button class="btn sm" id="reload" type="button">Refresh</button><button class="btn sm" id="signOut" type="button">Sign out</button></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#overview">Overview</a><a href="#board">Board</a><a href="#calendar">Calendar</a><a href="#units">Units</a><a href="#garages">Garages</a><a href="#credits">Credits</a><a href="#pros">Pros</a><a href="#licences">Licences</a>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
// The project and its public key: safe to publish. Without a signed-in admin the database answers nothing.
const PROJECT = 'https://rkjkxoecchzsucqtmawg.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJramt4b2VjY2h6c3VjcXRtYXdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5Njg3MjcsImV4cCI6MjEwNzU0NDcyN30.DZInBj8R0l1VX8lwFiviBlse39x3-xmAEo0Wfp4q_8A';
// Ghost Electronics' licence keys, public halves (tools/studio/licence_keys.js): an uploaded licence is checked against them.
const LICENCE_KEYS = [{"id":0,"spki":"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEu42LvxMSsX7GwowozduZtXLKc7THAh10nSokwkBP+fhwrZi0IyDMVl6e/M8k93UA1KfvAy29kFGSbDyctwVZ3Q=="},{"id":1,"spki":"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEyVYbuK6HRwXo3BnGls7zzXStJXAlSJxcTnk6t9y2XcpaS025ihZ6N4iM7RwbyJe/UMdkvQl2KyRmo1CNMxq8Iw=="}];
const sb = supabase.createClient(PROJECT, ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const PRODUCT = { gauge:'Ghost Gauge', pro:'Ghost Gauge Pro', nano:'Ghost Gauge Nano' };
// times as the Sheet showed them: Doha, yyyy-mm-dd hh:mm
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Qatar', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
const when = v => { if (!v) return ''; const p = Object.fromEntries(fmt.formatToParts(new Date(v)).map(x => [x.type, x.value])); return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const day = v => (v ? when(v).slice(0, 10) : '');
const money = (m, cur) => (m == null ? 'not set' : `${(m / 100).toFixed(2)} ${cur || 'QAR'}`);
const signed = n => `<span class="${n > 0 ? 'plus' : 'minus'}">${n > 0 ? '+' : ''}${n}</span>`;
function toast(t, bad) { const el = $('#toast'); el.textContent = t; el.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => { el.className = 'toast'; }, 3200); }

// ---------- signing in: a code by email, nothing else ----------
let pendingEmail = '';
function gateStep(code) {
  $('#emailField').hidden = code; $('#codeField').hidden = !code; $('#gateBack').hidden = !code;
  $('#gateBtn').textContent = code ? 'Sign in' : 'Email me a code';
  $('#email').required = !code; $('#code').required = code;
  (code ? $('#code') : $('#email')).focus();
}
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('#gateMsg'), btn = $('#gateBtn');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '';
  try {
    if ($('#codeField').hidden) {
      pendingEmail = $('#email').value.trim().toLowerCase();
      const { error } = await sb.auth.signInWithOtp({ email:pendingEmail, options:{ shouldCreateUser:true } });
      if (error) throw error;
      msg.textContent = `A code is on its way to ${pendingEmail}. It works for 10 minutes.`;
      gateStep(true);
    } else {
      const { error } = await sb.auth.verifyOtp({ email:pendingEmail, token:$('#code').value.trim(), type:'email' });
      if (error) throw error;
      $('#code').value = '';
    }
  } catch (err) {
    msg.className = 'msg bad';
    msg.textContent = /only/i.test(err.message) ? 'This page is for Ghost Electronics only.' : /rate|seconds/i.test(err.message) ? 'Too many codes asked for. Wait a few minutes, then try again.'
      : /expired|invalid/i.test(err.message) ? 'That code is wrong or has run out. Ask for a new one.' : err.message;
  } finally { btn.disabled = false; }
});
$('#gateBack').addEventListener('click', () => { $('#gateMsg').textContent = ''; gateStep(false); });
$('#signOut').addEventListener('click', () => sb.auth.signOut());
$('#reload').addEventListener('click', () => load().then(render));

sb.auth.onAuthStateChange((_e, session) => { setTimeout(() => show(session), 0); });
let shownFor;                 // undefined until the first answer, so "nobody signed in" is shown too
async function show(session) {
  if (window.__previewData) return;           // the preview has no session and needs none
  const email = session?.user?.email || null;
  if (email === shownFor) return;
  shownFor = email;
  $('#gate').hidden = !!email; $('#app').hidden = !email;
  if (!email) { gateStep(false); return; }
  $('#whoEmail').textContent = email;
  me = email.toLowerCase();
  const { data:admin } = await sb.rpc('is_admin');
  if (!admin) { $('#view').innerHTML = '<p class="panel">This address isn’t one of Ghost Electronics’ admins.</p>'; return; }
  $('#view').innerHTML = '<p class="dim">Loading…</p>';
  await load(); render();
}

// ---------- the data: small enough to fetch whole ----------
let D = null;
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
async function load() {
  try {
    const [units, history, garages, licences, ledger, pros, prices, payments, counters, requests] = await Promise.all([
      q(sb.from('units_full').select('*').order('allocated_at', { ascending:false })),
      q(sb.from('unit_history').select('*').order('at', { ascending:false }).limit(5000)),
      q(sb.from('garages_summary').select('*').order('name')),
      q(sb.from('licences_status').select('*').order('issued', { ascending:false, nullsFirst:false })),
      q(sb.from('ledger').select('*').order('id', { ascending:false }).limit(2000)),
      q(sb.from('pros').select('*').order('created_at', { ascending:false })),
      q(sb.from('prices').select('*').order('sort')),
      q(sb.from('payments').select('*').order('created_at', { ascending:false }).limit(500)),
      q(sb.from('counters').select('*')),
      q(sb.from('licence_requests').select('*').order('created_at', { ascending:false }).limit(300)),
    ]);
    D = prep({ units, history, garages, licences, ledger, pros, prices, payments, counters, requests });
    D.board = await loadBoard();
  } catch (e) { toast(`Couldn’t load: ${e.message}`, true); }
}

function prep(r) {
  return { ...r, board:r.board || null, requests:r.requests || [], counters:Object.fromEntries(r.counters.map(c => [c.name, Number(c.value)])), gname:Object.fromEntries(r.garages.map(g => [g.gid, g.name])) };
}

// ---------- the views, by the address's #part ----------
window.addEventListener('hashchange', render);
function render() {
  if (!D) return;
  const [page, arg] = decodeURIComponent(location.hash.slice(1) || 'overview').split('/');
  document.querySelectorAll('nav.tabs a').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + (page === 'unit' ? 'units' : page === 'garage' ? 'garages' : page === 'item' ? 'board' : page)));
  document.querySelectorAll('nav.tabs a[aria-current]').forEach(a => a.setAttribute('aria-current', 'page'));
  const waiting = D.requests.filter(r => r.status === 'pending').length;

  for (const at of [0, 32]) { let len = der[i + 1], p = i + 2; i = p + len; while (len > 32 && der[p] === 0) { p++; len--; } out.set(der.subarray(p, p + len), at + 32 - len); }
  return out;
}
async function checkLicenceFile(file, req) {
  if (!file || file.format !== 'ghost-studio-licence' || typeof file.payload !== 'string') throw new Error('That isn’t a .ghostlicence file.');
  const bytes = unb64(file.payload), p = JSON.parse(new TextDecoder().decode(bytes));
  if (p.machine !== req.machine || p.pub !== req.pub) throw new Error(`That licence is for another laptop (${p.code}), not ${req.code}.`);
  const key = LICENCE_KEYS.find(k => k.id === file.key);
  if (!key) throw new Error('That licence names a key Ghost Electronics doesn’t have.');
  const hex = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(b => b.toString(16).padStart(2, '0')).join('');
  const pub = await crypto.subtle.importKey('spki', unb64(key.spki.replace(/\+/g, '-').replace(/\//g, '_')), { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, pub, derToRaw(unb64(file.sig)), new TextEncoder().encode('GGLC1|' + hex));
  if (!ok) throw new Error('That licence wasn’t made with Ghost Electronics’ key, or it was changed.');
  return p;
}

const STAGES = ['Idea', 'Designed', 'Building', 'Testing', 'Done'];
const STATES = ['To do', 'Doing', 'Done', 'Blocked'];
const KINDS = ['Build', 'Design', 'Test', 'Order', 'Release', 'Decide', 'Fix', 'Docs'];

const who = (v, cap) => (!v || v === 'Claude' ? 'Claude' : v === me ? `<b>${cap ? 'You' : 'you'}</b>` : esc(v));
const changedLine = r => `Added ${day(r.created_at)}${new Date(r.updated_at) - new Date(r.created_at) > 60e3 ? ` · changed by ${who(r.updated_by)} ${when(r.updated_at)}` : ` by ${who(r.updated_by)}`}`;
const today = () => day(new Date());
const opts = (list, cur, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') + list.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');

async function all(table, order) {           // the API hands out 1000 rows at a time
  const out = [];
  for (let from = 0; ; from += 1000) {
    const rows = await q(sb.from(table).select('*').order(order).range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}
async function loadBoard() {
  try {
    const [items, steps, notes, changes] = await Promise.all([all('board_items', 'id'), all('board_steps', 'id'), all('board_notes', 'id'),
      q(sb.from('board_changes').select('*').order('at', { ascending:false }).limit(1000))]);
    return { items, steps, notes, changes };
  } catch (e) { toast(`Couldn’t load the board: ${e.message}`, true); return null; }
}
// A redraw after a save keeps whatever is still being typed elsewhere on the page: each field that differs from
// what it was drawn with, and the focus and caret.
const FIELDS = '#view input, #view textarea, #view select', FOCUSABLE = FIELDS + ', #view button';
const fieldKey = el => el.id ? '#' + el.id : el.dataset.sf ? `s${el.closest('[data-step]')?.dataset.step}:${el.dataset.sf}`
  : el.dataset.nf ? `n${el.closest('[data-note]')?.dataset.note}:${el.dataset.nf}` : el.dataset.stepstate ? 'ss' + el.dataset.stepstate
  : el.dataset.sdel ? 'sd' + el.dataset.sdel : el.dataset.ndel ? 'nd' + el.dataset.ndel : '';
const drawnIndex = el => Math.max(0, [...el.options].findIndex(o => o.defaultSelected));
const unsaved = el => (el.type === 'checkbox' ? el.checked !== el.defaultChecked
  : el.tagName === 'SELECT' ? el.selectedIndex !== drawnIndex(el) : el.value !== el.defaultValue);
const resetField = el => { el.value = el.defaultValue; el.checked = el.defaultChecked; if (el.tagName === 'SELECT') el.selectedIndex = drawnIndex(el); };
let pressing = false;
document.addEventListener('pointerdown', () => { pressing = true; }, true);
['pointerup', 'pointercancel', 'dragend', 'drop'].forEach(t => document.addEventListener(t, () => setTimeout(() => { pressing = false; }), true));
function afterPress(fn) {
  if (!pressing) return setTimeout(fn);
  let done = false; const go = () => { if (done) return; done = true; document.removeEventListener('click', go, true); setTimeout(fn); };
  document.addEventListener('click', go, true); setTimeout(go, 1500);
}
function rerender() {
  const a = document.activeElement;
  if (pressing) return afterPress(rerender);
  if (a?.type === 'date' && a.closest('#view')) { a.addEventListener('blur', () => afterPress(rerender), { once:true }); return; }
  const y = window.scrollY, keep = new Map();
  document.querySelectorAll(FIELDS).forEach(el => { const k = fieldKey(el); if (k && unsaved(el)) keep.set(k, el.type === 'checkbox' ? el.checked : el.value); });
  const focus = a && a.closest?.('#view') ? { k:fieldKey(a), s:a.selectionStart, e:a.selectionEnd } : null;
  render(); window.scrollTo(0, y);
  document.querySelectorAll(FIELDS).forEach(el => { const k = fieldKey(el); if (keep.has(k)) { if (el.type === 'checkbox') el.checked = keep.get(k); else el.value = keep.get(k); } });
  if (focus?.k) { const el = [...document.querySelectorAll(FOCUSABLE)].find(x => fieldKey(x) === focus.k); if (el) { el.focus({ preventScroll:true }); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch {} } }
}
async function write(p, msg, reset) {    // reset: the add form's fields, back to how they were drawn once it's in
  const { error } = await p;
  if (error) { toast(error.message, true); return false; }
  (reset || []).forEach(r => { const [sel, sent] = Array.isArray(r) ? r : [r]; const el = $(sel);
    if (el && (sent === undefined || (el.type === 'checkbox' ? el.checked : el.value) === sent)) resetField(el); });
  D.board = await loadBoard(); if (msg) toast(msg); rerender();
  return true;
}
const stepsOf = id => D.board.steps.filter(s => s.item_id === id).sort((a, b) => a.seq - b.seq || a.id - b.id);
const blocks = st => `<span class="blocks" aria-hidden="true">${st.map(s => `<i class="${s.state.replace(' ', '')}" title="${esc(s.step)}"></i>`).join('')}</span>`;
const stateSelect = s => `<select data-stepstate="${s.id}" aria-label="State">${opts(STATES, s.state)}</select>`;
const noBoard = '<h1>Board</h1><p class="panel">The board didn’t load. Try Refresh.</p>';
function bindStepState() {
  document.querySelectorAll('[data-stepstate]').forEach(el => el.addEventListener('change', () => {
    const s = D.board.steps.find(x => String(x.id) === el.dataset.stepstate);
    const patch = { state:el.value };
    if (el.value === 'Done' && s.state !== 'Done') patch.day = today();     // a step done now lands on today in the calendar
    write(sb.from('board_steps').update(patch).eq('id', s.id), `${el.value}: ${s.step}`);
  }));
}

  return `<div class="tools"><div class="seg" role="group" aria-label="Who">${[['', 'Everyone'], ['you', 'You'], ['claude', 'Claude']].map(([v, n]) => `<button type="button" data-who="${v}" aria-pressed="${f === v}">${n}</button>`).join('')}</div></div>
  <section class="panel">${rows.length ? `<ol class="timeline">${rows.map(c => `<li><time>${when(c.at)}</time><div class="what">${changeLine(c, name)}</div></li>`).join('')}</ol>` : '<p class="empty">No changes yet.</p>'}</section>
  <p class="msg">Every change to the board, with who made it: you, or Claude’s daily refresh at 5 in the morning, which brings in what changed in the repo and never undoes yours.</p>`;
}

function item(id) {
  const i = D.board?.items.find(x => x.id === id);
  if (!D.board) return noBoard;
  if (!i) return '<a class="back" href="#board">‹ Board</a><p class="panel">No such workstream.</p>';
  const st = stepsOf(id), notes = D.board.notes.filter(n => n.item_id === id).sort((a, b) => String(a.day).localeCompare(String(b.day)));
  const products = [...new Set(D.board.items.map(x => x.product))].sort();
  setTimeout(() => {
    document.querySelectorAll('[data-setstage]').forEach(x => x.addEventListener('click', () => { if (x.dataset.setstage !== i.stage) write(sb.from('board_items').update({ stage:x.dataset.setstage }).eq('id', id), `Stage: ${x.dataset.setstage}`); }));
    $('#iSave').addEventListener('click', () => {   // only the boxes you edited, so it never puts back an older value
      const boxes = { name:'#iName', product:'#iProduct', area:'#iArea', summary:'#iSummary', next_step:'#iNext', waiting_on:'#iWait', blocked:'#iBlocked', planned:'#iPlanned' };
      ['#iName', '#iProduct'].forEach(sel => { if (!$(sel).value.trim()) resetField($(sel)); });   // a workstream keeps its name
      const edited = Object.entries(boxes).filter(([, sel]) => unsaved($(sel)));
      const raw = sel => ($(sel).type === 'checkbox' ? $(sel).checked : $(sel).value);
      const patch = Object.fromEntries(edited.map(([k, sel]) => [k, k === 'blocked' ? raw(sel) : k === 'summary' ? raw(sel) : k === 'planned' ? raw(sel).trim() || 'Not scheduled' : raw(sel).trim()]));
      if (!edited.length) return toast('Nothing changed');
      write(sb.from('board_items').update(patch).eq('id', id), 'Saved', edited.map(([, sel]) => [sel, raw(sel)]));
    });
    $('#iDelete').addEventListener('click', async () => {
      if (!confirm(`Remove “${i.name}” and its ${st.length} step${st.length === 1 ? '' : 's'} from the board? Its calendar notes stay.`)) return;
      if (await write(sb.from('board_items').delete().eq('id', id), 'Removed')) location.hash = '#board';
    });
    bindStepState();
    document.querySelectorAll('[data-sf]').forEach(el => el.addEventListener(el.type === 'date' ? 'blur' : 'change', () => {
      if (el.type === 'date' && el.validity.badInput) { resetField(el); return toast('That date isn’t finished, so it wasn’t saved', true); }
      if (el.type === 'date' && el.value === el.defaultValue) return;
      const sid = el.closest('[data-step]').dataset.step, f = el.dataset.sf;
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (f === 'day') v = v || null;
      if (f === 'step' && !v.trim()) { resetField(el); return toast('A step needs words', true); }
      write(sb.from('board_steps').update({ [f]:v }).eq('id', sid), 'Saved');
    }));
    document.querySelectorAll('[data-sdel]').forEach(x => x.addEventListener('click', () => {
      const s = st.find(y => String(y.id) === x.dataset.sdel);
      if (confirm(`Remove the step “${s.step}”?`)) write(sb.from('board_steps').delete().eq('id', s.id), 'Step removed');
    }));
    $('#sAdd').addEventListener('click', () => {
      const t = $('#sText').value.trim(); if (!t) return toast('What is the step?', true);
      write(sb.from('board_steps').insert({ item_id:id, seq:Math.max(0, ...st.map(s => s.seq)) + 1, step:t, kind:$('#sKind').value, needs_you:$('#sYou').checked, day:$('#sDay').value || null }), 'Step added', ['#sText', '#sKind', '#sDay', '#sYou']);
    });
    $('#inAdd').addEventListener('click', () => {
      const d = $('#inDay').value, t = $('#inTitle').value.trim();
      if (!d || !t) return toast('A day and what it is', true);
      write(sb.from('board_notes').insert({ day:d, title:t, note:$('#inNote').value.trim(), item_id:id, stage:$('#inStage').value || null }), 'On the calendar', ['#inDay', '#inStage', '#inTitle', '#inNote']);
    });
  });
  return `<a class="back" href="#board">‹ Board</a>
  <h1>${esc(i.name)}</h1>
  <div class="tools"><div class="seg" role="group" aria-label="Stage">${STAGES.map(s => `<button type="button" data-setstage="${s}" aria-pressed="${s === i.stage}">${s}</button>`).join('')}</div>
    <span class="dim">${esc(i.product)}${i.area ? ' · ' + esc(i.area) : ''}</span></div>
  <div class="two">
    <section class="panel"><h2>Where it stands</h2><div class="form">
      <label class="full">Summary<textarea id="iSummary">${esc(i.summary)}</textarea></label>
      <label class="full">Next step<input id="iNext" value="${esc(i.next_step)}"></label>
      <label class="full">Waiting on<input id="iWait" value="${esc(i.waiting_on)}" placeholder="Nothing"></label>
      <label class="check full"><input type="checkbox" id="iBlocked" ${i.blocked ? 'checked' : ''}> It can’t move until that happens</label>
      <label class="full">Planned<input id="iPlanned" value="${esc(i.planned)}"></label>
      <label>Name<input id="iName" value="${esc(i.name)}"></label>
      <label>Product<input id="iProduct" list="iProducts" value="${esc(i.product)}"><datalist id="iProducts">${products.map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>
      <label>Area<input id="iArea" value="${esc(i.area)}"></label>
      <div class="tools full"><button class="btn gold" id="iSave" type="button">Save</button><button class="btn danger" id="iDelete" type="button">Remove from the board</button></div>
    </div></section>
    <section class="panel"><h2>About it</h2><dl class="kv">
      <dt>Steps done</dt><dd>${blocks(st)} ${st.filter(s => s.state === 'Done').length} of ${st.length}</dd>
      <dt>Added</dt><dd>${when(i.created_at)}</dd>
      <dt>Last change</dt><dd>${who(i.updated_by, true)} · ${when(i.updated_at)}</dd>
      <dt>Started</dt><dd>${esc(i.started_on || '—')}</dd>
      <dt>Last activity</dt><dd>${esc(i.last_activity || '—')}</dd>
      <dt>Sources</dt><dd class="mono" style="font-size:11.5px">${esc(i.sources || '—')}</dd></dl>
      <h2 style="margin-top:18px">On the calendar</h2>
      ${notes.length ? `<ul class="day">${notes.map(n => `<li><div><a href="#calendar/${esc(n.day.slice(0, 7))}" data-calday="${esc(n.day)}">${esc(n.day)}</a> ${n.stage ? `<span class="stage ${n.stage}">${n.stage}</span>` : ''} <b>${esc(n.title)}</b></div>${n.note ? `<div class="dim">${esc(n.note)}</div>` : ''}<span class="by">${changedLine(n)}</span></li>`).join('')}</ul>` : '<p class="dim" style="margin:0 0 10px">Nothing yet.</p>'}
      <div class="form" style="margin-top:10px"><label>Day<input type="date" id="inDay" value="${today()}"></label><label>Stage it should reach<select id="inStage">${opts(STAGES, '', 'No stage')}</select></label>
        <label class="full">What<input id="inTitle" placeholder="Order the boards"></label><label class="full">Note<input id="inNote" placeholder="Optional"></label>
        <div><button class="btn" id="inAdd" type="button">Add to the calendar</button></div></div></section>
  </div>
  <section class="panel"><h2>Steps</h2>
    ${st.length ? `<ol class="steps">${st.map(s => `<li class="${s.state.replace(' ', '')}" data-step="${s.id}">${stateSelect(s)}
      <div class="f"><input class="txt" data-sf="step" value="${esc(s.step)}" aria-label="Step">
        <div class="row"><input data-sf="note" value="${esc(s.note)}" placeholder="Note" aria-label="Note" style="flex:1 1 200px">
          <input type="date" data-sf="day" value="${esc(s.day || '')}" aria-label="Date">
          <select data-sf="kind" aria-label="Kind">${opts(KINDS.includes(s.kind) ? KINDS : [s.kind, ...KINDS], s.kind)}</select>
          <label class="check"><input type="checkbox" data-sf="needs_you" ${s.needs_you ? 'checked' : ''}> Needs you</label></div>
        <span class="by">${s.source ? `<span class="mono">${esc(s.source)}</span> · ` : ''}${changedLine(s)}</span></div>
      <button class="btn sm danger" type="button" data-sdel="${s.id}" aria-label="Remove this step">✕</button></li>`).join('')}</ol>` : '<p class="empty">No steps yet.</p>'}
    <div class="form" style="margin-top:12px"><label class="full">A new step<input id="sText" placeholder="Fit the probe by the belt and check its reading"></label>
      <label>Kind<select id="sKind">${opts(KINDS, 'Build')}</select></label><label>Date<input type="date" id="sDay"></label>
      <label class="check"><input type="checkbox" id="sYou"> Needs you</label><div><button class="btn gold" id="sAdd" type="button">Add step</button></div></div>
  </section>`;
}

let calSel = '';
document.addEventListener('click', e => { const a = e.target.closest('[data-calday]'); if (a) calSel = a.dataset.calday; });
function calendar(arg) {
  if (!D.board) return noBoard.replace('Board', 'Calendar');
  const now = today(), month = /^\d{4}-\d{2}$/.test(arg || '') ? arg : (calSel || now).slice(0, 7);
  if (!calSel || calSel.slice(0, 7) !== month) calSel = month === now.slice(0, 7) ? now : month + '-01';
  const [y, m] = month.split('-').map(Number);
  const iso = d => d.toISOString().slice(0, 10), shift = (k) => { const d = new Date(Date.UTC(y, m - 1 + k, 1)); return iso(d).slice(0, 7); };
  const first = new Date(Date.UTC(y, m - 1, 1)), start = new Date(Date.UTC(y, m - 1, 1 - first.getUTCDay()));
  let cells = Array.from({ length:42 }, (_, k) => iso(new Date(start.getTime() + k * 864e5)));
  if (cells[35].slice(0, 7) !== month) cells = cells.slice(0, 35);
  const name = Object.fromEntries(D.board.items.map(i => [i.id, i.name]));
  const notesOn = d => D.board.notes.filter(n => n.day === d), stepsOn = d => D.board.steps.filter(s => s.day === d);
  const cell = d => {
    const ns = notesOn(d), ss = stepsOn(d), done = ss.filter(s => s.state === 'Done'), due = ss.filter(s => s.state !== 'Done');
    const lines = [...ns.map(n => `<span class="e ${n.kind}">${n.stage ? n.stage + ': ' : ''}${esc(n.title)}</span>`),
      ...(done.length ? [`<span class="e done">${done.length} step${done.length === 1 ? '' : 's'} done</span>`] : []),
      ...due.map(s => `<span class="e due">${esc(s.step)}</span>`)];
    return `<button type="button" class="d${d.slice(0, 7) !== month ? ' out' : ''}${d === now ? ' today' : ''}${d === calSel ? ' sel' : ''}" data-day="${d}" aria-label="${d}"><span class="num">${Number(d.slice(8))}</span>${lines.slice(0, 4).join('')}${lines.length > 4 ? `<span class="dim" style="font-size:11px">+${lines.length - 4} more</span>` : ''}</button>`;
  };
  const sel = calSel, ns = notesOn(sel), ss = stepsOn(sel);
  const coming = [...D.board.notes.filter(n => n.day > now).map(n => ({ day:n.day, html:`${n.stage ? `<span class="stage ${n.stage}">${n.stage}</span> ` : ''}<b>${esc(n.title)}</b>${n.item_id && name[n.item_id] ? ` <span class="dim">·</span> <a href="#item/${esc(n.item_id)}">${esc(name[n.item_id])}</a>` : ''}` })),
    ...D.board.steps.filter(s => s.day && s.day >= now && s.state !== 'Done').map(s => ({ day:s.day, html:`<span class="dim">Step due:</span> ${esc(s.step)} <span class="dim">·</span> <a href="#item/${esc(s.item_id)}">${esc(name[s.item_id])}</a>` }))]
    .sort((a, b) => a.day.localeCompare(b.day)).slice(0, 30);
  const itemOpts = cur => `<option value="">No workstream</option>` + [...D.board.items].sort((a, b) => a.name.localeCompare(b.name)).map(i => `<option value="${esc(i.id)}" ${i.id === cur ? 'selected' : ''}>${esc(i.name)}</option>`).join('');
  setTimeout(() => {
    document.querySelectorAll('[data-month]').forEach(x => x.addEventListener('click', () => {
      calSel = x.dataset.month === now.slice(0, 7) ? now : '';
      const h = '#calendar/' + x.dataset.month;
      if (location.hash === h) rerender(); else location.hash = h;
    }));
    document.querySelectorAll('.cal [data-day]').forEach(x => x.addEventListener('click', () => {
      calSel = x.dataset.day;
      if (calSel.slice(0, 7) !== month) { location.hash = '#calendar/' + calSel.slice(0, 7); return; }
      rerender(); $('#calDay').scrollIntoView({ block:'nearest' });
    }));
    document.querySelectorAll('[data-nf]').forEach(el => el.addEventListener(el.type === 'date' ? 'blur' : 'change', () => {
      if (el.type === 'date' && el.validity.badInput) { resetField(el); return toast('That date isn’t finished, so it wasn’t saved', true); }
      if (el.type === 'date' && el.value === el.defaultValue) return;
      const nid = el.closest('[data-note]').dataset.note, f = el.dataset.nf, v = el.value;
      if ((f === 'title' || f === 'day') && !v.trim()) { resetField(el); return toast(f === 'day' ? 'A note needs a day' : 'A note needs a title', true); }
      if (f === 'day') calSel = v;
      write(sb.from('board_notes').update({ [f]:(f === 'item_id' || f === 'stage') ? v || null : v }).eq('id', nid), 'Saved')
        .then(ok => { if (ok && f === 'day' && v.slice(0, 7) !== month) { calSel = v; location.hash = '#calendar/' + v.slice(0, 7); } });
    }));
    document.querySelectorAll('[data-ndel]').forEach(x => x.addEventListener('click', () => { if (confirm('Remove this note from the calendar?')) write(sb.from('board_notes').delete().eq('id', x.dataset.ndel), 'Removed'); }));
    $('#cnAdd').addEventListener('click', () => {
      const t = $('#cnTitle').value.trim(); if (!t) return toast('What is it?', true);
      write(sb.from('board_notes').insert({ day:sel, title:t, note:$('#cnNote').value.trim(), item_id:$('#cnItem').value || null, stage:$('#cnStage').value || null }), 'On the calendar', ['#cnTitle', '#cnNote', '#cnItem', '#cnStage']);
    });
  });
  const title = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString('en-GB', { month:'long', year:'numeric', timeZone:'UTC' });
  const selTitle = new Date(sel + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'UTC' });
  return `<h1>Calendar</h1>
  <div class="tools"><button class="btn sm" type="button" data-month="${shift(-1)}" aria-label="Last month">‹</button><b style="min-width:150px;text-align:center">${title}</b>
    <button class="btn sm" type="button" data-month="${shift(1)}" aria-label="Next month">›</button><button class="btn sm" type="button" data-month="${now.slice(0, 7)}">Today</button>
    <span class="legend" style="margin-inline-start:auto"><span class="note">Note</span><span class="release">Release</span><span class="done">Steps done</span><span class="due">Step due</span></span></div>
  <div class="cal">${['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => `<div class="dow">${d}</div>`).join('')}${cells.map(cell).join('')}</div>
  <div class="two">
    <section class="panel" id="calDay"><h2>${esc(selTitle)}</h2>
      ${ns.length || ss.length ? `<ul class="day">
        ${ns.map(n => `<li data-note="${n.id}"><div class="form">
          <label class="full">${n.kind === 'release' ? 'Release' : 'Note'}<input data-nf="title" value="${esc(n.title)}"></label>
          <label class="full">Detail<input data-nf="note" value="${esc(n.note)}" placeholder="Optional"></label>
          <label>Workstream<select data-nf="item_id">${itemOpts(n.item_id)}</select></label>
          <label>Stage it should reach<select data-nf="stage">${opts(STAGES, n.stage || '', 'No stage')}</select></label>
          <label>Day<input type="date" data-nf="day" value="${esc(n.day)}"></label>
          <div><button class="btn sm danger" type="button" data-ndel="${n.id}">Remove</button></div></div>
          <span class="by">${changedLine(n)}</span></li>`).join('')}
        ${ss.map(s => `<li><div>${s.state === 'Done' ? '<span class="badge PASS">DONE</span>' : `<span class="badge allocated">${esc(s.state.toUpperCase())}</span>`} ${esc(s.step)}</div>
          <div class="dim"><a href="#item/${esc(s.item_id)}">${esc(name[s.item_id])}</a></div></li>`).join('')}</ul>` : '<p class="empty">Nothing on this day yet.</p>'}
      <h2 style="margin-top:18px">Add a note</h2><div class="form">
        <label class="full">What<input id="cnTitle" placeholder="Pro board ordered"></label><label class="full">Detail<input id="cnNote" placeholder="Optional"></label>
        <label>Workstream<select id="cnItem">${itemOpts('')}</select></label><label>Stage it should reach<select id="cnStage">${opts(STAGES, '', 'No stage')}</select></label>
        <div><button class="btn gold" id="cnAdd" type="button">Add to ${esc(sel)}</button></div></div></section>
    <section class="panel"><h2>Coming up</h2>${coming.length ? `<ol class="timeline">${coming.map(c => `<li><time>${esc(c.day)}</time><div class="what">${c.html}</div></li>`).join('')}</ol>` : '<p class="empty">Nothing planned yet. Add a note to a day, or a date to a step.</p>'}</section>
  </div>`;
}

// tools/admin/preview.js puts sample data in a local copy of the page, to check its layout without signing in
if (window.__previewData) { D = prep(window.__previewData); me = window.__previewData.me || ''; $('#gate').hidden = true; $('#app').hidden = false; $('#whoEmail').textContent = 'preview'; render(); }
else sb.auth.getSession().then(({ data }) => show(data.session));
})();
</script>
</body>
</html>
